name: Android Debug Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --build-cache --stacktrace

      - name: Rename APK ke app-debug-<commit>.apk
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/app-debug-${GITHUB_SHA:0:7}.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-${{ github.sha }}
          path: dist/app-debug-*.apk
          if-no-files-found: error
          retention-days: 30